name: Slack GitHub Notifications

on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, closed, merged, reopened]
  push:
    branches: [main, master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Set event info
        id: info
        run: |
          EVENT="${{ github.event_name }}"
          ACTION="${{ github.event.action }}"

          if [ "$EVENT" = "issues" ]; then
            TITLE="${{ github.event.issue.title }}"
            URL="${{ github.event.issue.html_url }}"
            NUMBER="#${{ github.event.issue.number }}"
            ACTOR="${{ github.actor }}"
            if [ "$ACTION" = "opened" ]; then
              EMOJI="🆕"; STATUS="이슈 생성"
            elif [ "$ACTION" = "closed" ]; then
              EMOJI="✅"; STATUS="이슈 완료"
            else
              EMOJI="🔄"; STATUS="이슈 재오픈"
            fi
          elif [ "$EVENT" = "pull_request" ]; then
            TITLE="${{ github.event.pull_request.title }}"
            URL="${{ github.event.pull_request.html_url }}"
            NUMBER="PR #${{ github.event.pull_request.number }}"
            ACTOR="${{ github.actor }}"
            if [ "$ACTION" = "opened" ]; then
              EMOJI="📬"; STATUS="PR 생성"
            elif [ "$ACTION" = "closed" ]; then
              if [ "${{ github.event.pull_request.merged }}" = "true" ]; then
                EMOJI="🎉"; STATUS="PR 머지"
              else
                EMOJI="❌"; STATUS="PR 닫힘"
              fi
            else
              EMOJI="🔄"; STATUS="PR 업데이트"
            fi
          elif [ "$EVENT" = "push" ]; then
            TITLE="${{ github.event.head_commit.message }}"
            URL="${{ github.event.compare }}"
            NUMBER="커밋"
            ACTOR="${{ github.actor }}"
            EMOJI="📦"; STATUS="푸시"
          fi

          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "number=$NUMBER" >> $GITHUB_OUTPUT
          echo "actor=$ACTOR" >> $GITHUB_OUTPUT

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v2
        with:
          channel-id: "C0ADA2MEKCN"
          slack-message: |
            ${{ steps.info.outputs.emoji }} *[${{ github.repository }}] ${{ steps.info.outputs.status }}*
            > ${{ steps.info.outputs.number }}: ${{ steps.info.outputs.title }}
            > 담당자: ${{ steps.info.outputs.actor }}
            > 링크: ${{ steps.info.outputs.url }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BYLINE</title>
    <link rel="icon" type="image/png" href="/assets/icon-byline-mark.png" />

    <!-- 홈 화면에 추가하면 브라우저 주소창 없이 진짜 앱처럼 열리게(standalone) 하는 설정.
         노션 앱 안 embed가 안 눌리는 걸 code로 우회할 방법은 없어서, 모바일에서는
         이 페이지 자체를 홈 화면 아이콘으로 설치해 쓰는 걸 정식 경로로 삼았다. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111111" />
    <link rel="apple-touch-icon" href="/assets/icon-byline-mark.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BYLINE" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body { margin: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react" src="/byline-widget.js"></script>
    <script type="text/babel" data-presets="react">
      ReactDOM.createRoot(document.getElementById('root')).render(<Byline />);
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
